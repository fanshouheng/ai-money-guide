site_name: AI变现指南 2024
site_description: 全面的AI变现指导手册，从新手入门到商业变现的完整路径
site_author: AI变现指南团队
site_url: https://ai-monetization-guide.github.io

# Repository
repo_name: ai-monetization-guide
repo_url: https://github.com/ai-monetization-guide/ai-monetization-guide
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 AI变现指南团队

# Configuration
theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.ico
  
  # Color scheme
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  # Icons
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-]'
      lang:
        - zh
        - en
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      timezone: Asia/Shanghai
      locale: zh
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true
  - glightbox

# Navigation
nav:
  - 主页: index.md
  - 第零章 新手必读:
    - 新手必读概述: chapter0/index.md
    - 认识AI: chapter0/what-is-ai.md
    - 基础设施准备: chapter0/preparation.md
    - 核心工具详解: chapter0/core-tools.md
  - 第一章 初阶项目:
    - 初阶项目概述: chapter1/index.md
    - 视频变现:
      - 概述: chapter1/video/index.md
      - 影视解说: chapter1/video/movie-explanation.md
      - 知识科普: chapter1/video/knowledge.md
      - 教程培训: chapter1/video/tutorial.md
      - AI主播: chapter1/video/digital-host.md
      - 故事绘本: chapter1/video/storybook.md
      - 病毒内容: chapter1/video/viral-content.md
    - 音频变现:
      - 概述: chapter1/audio/index.md
      - 声音克隆: chapter1/audio/voice-clone.md
      - 音乐创作: chapter1/audio/music.md
      - 有声内容: chapter1/audio/audiobook.md
      - 直播配音: chapter1/audio/live-dubbing.md
    - 图片变现:
      - 概述: chapter1/image/index.md
      - 个人头像: chapter1/image/avatar.md
      - 商品广告: chapter1/image/ads.md
      - 绘本插画: chapter1/image/illustration.md
      - 表情包: chapter1/image/sticker.md
    - 文案变现:
      - 概述: chapter1/writing/index.md
      - 新媒体文案: chapter1/writing/social-media.md
      - 小说创作: chapter1/writing/novel.md
      - 简历优化: chapter1/writing/resume.md
      - 论文代写: chapter1/writing/thesis.md
  - 第二章 进阶项目:
    - 进阶项目概述: chapter2/index.md
    - AI应用开发: chapter2/app-development.md
    - AI培训服务: chapter2/training-service.md
    - AI咨询顾问: chapter2/consulting.md
  - 第三章 商业变现:
    - 商业变现概述: chapter3/index.md
    - 商业模式设计: chapter3/business-model.md
    - 营销策略: chapter3/marketing.md
    - 客户获取: chapter3/customer-acquisition.md
  - 第四章 资源工具:
    - 资源工具概述: chapter4/index.md
    - AI工具清单: chapter4/tools.md
    - 学习资源: chapter4/learning-resources.md
    - 社区资源: chapter4/communities.md
  - 第五章 能力提升:
    - 能力提升概述: chapter5/index.md
    - 技能提升: chapter5/skill-improvement.md
    - 项目管理: chapter5/project-management.md
    - 未来展望: chapter5/future.md

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: ai-monetization-guide
      repo: ai-monetization-guide
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra
extra:
  # Analytics
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
    feedback:
      title: 这个页面有帮助吗？
      ratings:
        - icon: material/thumb-up-outline
          name: 有帮助
          data: 1
          note: >-
            谢谢你的反馈！
        - icon: material/thumb-down-outline
          name: 需要改进
          data: 0
          note: >-
            谢谢你的反馈！请帮助我们改进这个页面。

  # Social links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-monetization-guide
      name: GitHub
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ai_monetization
      name: Twitter
    - icon: fontawesome/solid/paper-plane
      link: mailto:contact@ai-monetization.com
      name: Email

  # Version
  version:
    provider: mike
    default: latest

  # Consent
  consent:
    title: Cookie 同意
    description: >-
      我们使用 cookies 来识别您的重复访问和偏好，以及
      衡量我们文档的有效性和用户是否找到他们正在搜索的内容。
      在您同意的情况下，您正在帮助我们改善我们的文档。

# Extra CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
